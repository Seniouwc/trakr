[package]
name = "trakr-midi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
midir = { version = "0.11.1", optional = true }
anyhow = "1.0.104"

[features]
default = []
# Real MIDI ports through midir (needs ALSA headers on Linux). Without it only the types and parser exist.
backend = ["dep:midir"]
